name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-sanitizers
            build_type: Debug
            sanitize: ON
          - name: release
            build_type: Release
            sanitize: OFF
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DM3_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
